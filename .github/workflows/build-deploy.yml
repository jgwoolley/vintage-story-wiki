name: Build and deploy wiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job gets the Pages write permissions it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The whole pipeline (download/ingest/build) is pure Node/npm now -- no system package is
    # ever shelled out to (the old `tar` CLI dependency of the downloader, now apps/vsdev/src/game/download.ts, was
    # replaced with the pure-JS `tar` npm package). `ubuntu-26.04` is pinned (not `ubuntu-latest`) so an image migration is a deliberate change. It is just a standard
    # GitHub-hosted runner choice, not an actual OS-level requirement of this project.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Hash vs-manifest.json for cache key
        id: manifest
        run: echo "hash=${{ hashFiles('vs-manifest.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded game server + mods
        uses: actions/cache@v6
        with:
          # ./vintagestory: the game install location every tool here uses (vsdev src/locations.ts); it holds the server here.
          path: |
            vintagestory
            Mods
          key: vs-data-${{ steps.manifest.outputs.hash }}

      # No dependency needs its install scripts (esbuild finds its platform package without its postinstall), so none run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # vsdev's render tests draw in Playwright's headless Chromium (software WebGL); the version matches the pinned playwright-core.
      - name: Install Chromium for the render tests
        run: npm run install-chromium

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Download game server + mods (skipped on cache hit)
        run: npm run download

      # Compiles libs/vs-schematic's TypeScript to dist/, which Eleventy copies to /assets/.
      - name: Build libraries
        run: npm run build:libs

      # Packages the VS Code extension to a .vsix, which Eleventy copies to /assets/downloads/ for the /extension/ page.
      - name: Package VS Code extension
        run: npm run build:extension

      - name: Ingest game data
        run: npm run ingest

      # Carry the previous run's eleventyBuildTiming.json into this build so /<lang>/build/ can show
      # it (the file is gitignored and nothing else persists it between runs). Cache entries are
      # immutable, so each run saves under a unique key and restores the newest by prefix.
      - name: Restore previous Eleventy build timing
        uses: actions/cache/restore@v6
        with:
          path: apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json
          key: eleventy-timing-${{ github.run_id }}
          restore-keys: eleventy-timing-

      - name: Build site
        # The site is served from the root of the custom domain below, so there is no path
        # prefix. (Without a custom domain, GitHub Pages project sites serve from
        # https://<user>.github.io/<repo>/ and every link/asset would need that repo-name
        # prefix -- see eleventy.config.js's pathPrefix.)
        # SITE_URL gives og:image/og:url an absolute origin, since Open Graph wants one.
        # apps/vs-wiki/scripts/build-site.ts is a thin wrapper around the real `eleventy` CLI that times the
        # whole build and writes apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json for the *next*
        # build to surface on /<lang>/build/ -- see that script's own comment for why Eleventy
        # can't report this about itself.
        env:
          PATH_PREFIX: /
          SITE_URL: https://vintagestory-wiki.nf3t.com
        run: npm run build:site

      - name: Save Eleventy build timing for the next run
        uses: actions/cache/save@v6
        with:
          path: apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json
          key: eleventy-timing-${{ github.run_id }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
