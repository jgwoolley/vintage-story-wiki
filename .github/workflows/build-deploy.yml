name: Build and deploy wiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The whole pipeline (download/ingest/build) is pure Node/npm now -- no system package is
    # ever shelled out to (the old `tar` CLI dependency in apps/vs-wiki/scripts/download.ts was replaced with
    # the pure-JS `tar` npm package). `ubuntu-latest` here is just GitHub Actions' standard
    # GitHub-hosted runner choice, not an actual OS-level requirement of this project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Hash vs-manifest.json for cache key
        id: manifest
        run: echo "hash=${{ hashFiles('vs-manifest.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded game server + mods
        uses: actions/cache@v4
        with:
          path: |
            vs_server
            Mods
          key: vs-data-${{ steps.manifest.outputs.hash }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Download game server + mods (skipped on cache hit)
        run: npm run download

      # Compiles libs/vs-schematic's TypeScript to dist/, which Eleventy copies to /assets/.
      - name: Build libraries
        run: npm run build:libs

      # Packages the VS Code extension to a .vsix, which Eleventy copies to /assets/downloads/ for the /extension/ page.
      - name: Package VS Code extension
        run: npm run build:extension

      - name: Ingest game data
        run: npm run ingest

      # Carry the previous run's eleventyBuildTiming.json into this build so /<lang>/build/ can show
      # it (the file is gitignored and nothing else persists it between runs). Cache entries are
      # immutable, so each run saves under a unique key and restores the newest by prefix.
      - name: Restore previous Eleventy build timing
        uses: actions/cache/restore@v4
        with:
          path: apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json
          key: eleventy-timing-${{ github.run_id }}
          restore-keys: eleventy-timing-

      - name: Build site
        # GitHub Pages project sites (no custom domain) serve from
        # https://<user>.github.io/<repo>/ rather than the domain root, so every internal
        # link/asset needs that repo-name prefix -- see eleventy.config.js's pathPrefix.
        # SITE_URL gives og:image/og:url an absolute origin, since Open Graph wants one.
        # apps/vs-wiki/scripts/build-site.ts is a thin wrapper around the real `eleventy` CLI that times the
        # whole build and writes apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json for the *next*
        # build to surface on /<lang>/build/ -- see that script's own comment for why Eleventy
        # can't report this about itself.
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npx tsx apps/vs-wiki/scripts/build-site.ts

      - name: Save Eleventy build timing for the next run
        uses: actions/cache/save@v4
        with:
          path: apps/vs-wiki/site/_data/generated/eleventyBuildTiming.json
          key: eleventy-timing-${{ github.run_id }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
