# vintagestory-wiki: DEV ONLY. Serves the already-built site (_site/) at http://vintagestory-wiki.localhost with nginx so
# you can look at a local build behind the devbox Traefik. Nothing is built here, and it is not how the wiki is deployed
# (that is GitHub Pages, .github/workflows/build-deploy.yml).
#
#   SITE_URL=http://vintagestory-wiki.localhost npx tsx apps/vs-wiki/scripts/build-site.ts   # after the CI steps; _site/
#   docker compose up -d       # docker compose down to stop
#
# Joins the shared devbox Traefik (devbox_network); no host ports. The mounts are read-only and must exist already:
# if one is missing, "up" fails instead of creating an empty root-owned directory.
# HOST_WORKSPACE is the workspace path on the Docker host, set in devbox terminals: the host's daemon resolves bind
# mounts, not the container. Run from a terminal on the host itself, the fallback (..) is the same directory.

services:
  web:
    image: nginx:alpine
    container_name: vintagestory-wiki
    read_only: true
    tmpfs: [/tmp, /run, /var/cache/nginx]
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE:-..}/vintage-story-wiki/_site
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK_NAME:-devbox_network}
      - traefik.http.routers.vintagestory-wiki.rule=Host(`${VINTAGESTORY_WIKI_HOST:-vintagestory-wiki.localhost}`)
      - traefik.http.routers.vintagestory-wiki.entrypoints=web
      - traefik.http.services.vintagestory-wiki.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: ${NETWORK_NAME:-devbox_network}
